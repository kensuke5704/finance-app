name: Apply Codex finance app update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-codex-update.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply prepared update
        shell: bash
        run: |
          cat > /tmp/finance-app-update.b64 <<'ARCHIVE'
          
          ARCHIVE
          base64 --decode /tmp/finance-app-update.b64 | tar -xzf -
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/globals.css app/page.tsx components/LoginGate.tsx components/finance/BudgetSettingsView.tsx components/finance/MomentumView.tsx lib/futureActualsCleanup.ts
          git commit -m "implement mobile finance app redesign and auto backup"
          git push

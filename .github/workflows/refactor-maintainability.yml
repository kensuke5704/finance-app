name: Maintainability refactor

on:
  push:
    branches: [main]
    paths:
      - scripts/refactor-maintainability.mjs
      - .github/workflows/refactor-maintainability.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply focused refactor
        run: node scripts/refactor-maintainability.mjs
      - name: Install dependencies
        run: npm ci
      - name: Verify production build
        run: npm run build
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: organize investment refresh flow"
          git push
